name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Next.js 16 requires Node 20.9+. The published CLI bin still
        # works on Node >=18 per npm-package.json engines field, but the
        # framework toolchain we need at CI time does not.
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint
        if: matrix.node-version == 22

      - name: Build
        run: npm run build
        if: matrix.node-version == 22
